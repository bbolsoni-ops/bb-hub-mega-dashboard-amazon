    <script>
      // Suppress benign WebSocket / Vite HMR connection warnings in cloud preview environment
      window.addEventListener('unhandledrejection', function(event) {
        var reason = (event && event.reason) ? (event.reason.message || String(event.reason)) : '';
        if (reason && (reason.indexOf('WebSocket') !== -1 || reason.indexOf('websocket') !== -1)) {
          event.preventDefault();
          event.stopPropagation();
        }
      });
    </script>
